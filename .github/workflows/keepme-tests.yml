name: Keepme Test Suite

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CLIENT: keepme
  CLIENT_NAME: Test Demo Client
  HEADLESS: 'true'
  EMAIL: ${{ secrets.KEEPME_EMAIL }}
  PASSWORD: ${{ secrets.KEEPME_PASSWORD }}
  API_KEY: ${{ secrets.KEEPME_API_KEY }}
  ORGANIZATION_ID: ${{ secrets.KEEPME_ORGANIZATION_ID }}
  BASE_URL: ${{ secrets.KEEPME_BASE_URL }}
  CRM_URL: ${{ secrets.KEEPME_CRM_URL }}
  CRM_USERNAME: ${{ secrets.KEEPME_CRM_USERNAME }}
  CRM_PASSWORD: ${{ secrets.KEEPME_CRM_PASSWORD }}
  API_BASE_URL: ${{ secrets.KEEPME_API_BASE_URL }}
  XCLIENTID: ${{ secrets.KEEPME_XCLIENTID }}
  XCLIENTSECRET: ${{ secrets.KEEPME_XCLIENTSECRET }}
  COOKIE: ${{ secrets.KEEPME_COOKIE }}

jobs:
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run smoke tests
        run: yarn test:smoke:keepme

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports
          path: |
            reports/
            screenshots/
            videos/
          if-no-files-found: ignore

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run E2E tests
        run: yarn test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  notify-slack:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [smoke-tests, e2e-tests]
    if: always()
    steps:
      - name: Determine overall result
        id: result
        shell: bash
        run: |
          smoke="${{ needs.smoke-tests.result }}"
          e2e="${{ needs.e2e-tests.result }}"

          if [[ "$smoke" == "success" && "$e2e" == "success" ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "color=#36a64f" >> "$GITHUB_OUTPUT"
            echo "message=✅ CI passed for ${{ github.repository }}" >> "$GITHUB_OUTPUT"
          elif [[ "$smoke" == "cancelled" || "$e2e" == "cancelled" ]]; then
            echo "status=cancelled" >> "$GITHUB_OUTPUT"
            echo "color=#f59e0b" >> "$GITHUB_OUTPUT"
            echo "message=⚠️ CI was cancelled for ${{ github.repository }}" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "color=#dc2626" >> "$GITHUB_OUTPUT"
            echo "message=❌ CI failed for ${{ github.repository }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        shell: bash
        run: |
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "SLACK_WEBHOOK_URL secret is not configured. Skipping Slack notification."
            exit 0
          fi

          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \"${{ steps.result.outputs.message }}\",
              \"attachments\": [{
                \"color\": \"${{ steps.result.outputs.color }}\",
                \"blocks\": [{
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*Repository:* ${{ github.repository }}\\n*Branch:* ${{ github.ref_name }}\\n*Commit:* ${{ github.sha }}\\n*Workflow:* ${{ github.workflow }}\\n*Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\\n*Status:* ${{ steps.result.outputs.status }}\"
                  }
                }]
              }]
            }" \
            "$SLACK_WEBHOOK_URL"
